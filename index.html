<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clearderma.com.ua | Преміальна дермакосметика</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#FDFCFB', 100: '#F5F5F4', 400: '#A8A29E', 800: '#292524', 900: '#1C1917' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html { scroll-behavior: smooth; }
        .hide-scroll::-webkit-scrollbar { width: 4px; }
        .hide-scroll::-webkit-scrollbar-track { background: transparent; }
        .hide-scroll::-webkit-scrollbar-thumb { background: #e7e5e4; border-radius: 4px; }
        .drawer-open { transform: translateX(0); }
        .drawer-closed { transform: translateX(100%); }
        .overlay-open { opacity: 1; pointer-events: auto; }
        .overlay-closed { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="bg-brand-50 text-brand-900 font-sans antialiased">

    <header class="sticky top-0 z-40 w-full backdrop-blur-md bg-white/70 border-b border-brand-100">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="#" class="text-2xl font-light tracking-wide">clear<span class="font-semibold">derma</span></a>
            <button onclick="toggleCart()" class="p-2 relative"><i data-lucide="shopping-bag" class="w-5 h-5"></i><span id="cart-badge" class="hidden absolute top-0 right-0 bg-brand-900 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-4 py-16 grid md:grid-cols-2 gap-12 items-center">
        <div><h1 class="text-4xl md:text-5xl font-light mb-6">Чиста краса.<br><span class="font-semibold">Науковий підхід.</span></h1><a href="#catalog" class="bg-brand-900 text-white px-8 py-4 rounded">Перейти до каталогу</a></div>
        <div class="bg-brand-100 aspect-square rounded-2xl"></div>
    </section>

    <section id="catalog" class="max-w-7xl mx-auto px-4 py-16">
        <h2 class="text-2xl font-semibold mb-8">Каталог продукції</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8"></div>
    </section>

    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 transition-opacity duration-300 overlay-closed"></div>
    <div id="cart-drawer" class="fixed top-0 right-0 w-full max-w-md h-full bg-white shadow-2xl z-50 transition-transform duration-300 drawer-closed flex flex-col">
        <div class="p-6 border-b flex justify-between"><h2>Ваш кошик</h2><button onclick="toggleCart()">✕</button></div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        <div class="p-6 border-t"><button onclick="checkout()" class="w-full bg-brand-900 text-white py-4 rounded">Оформити замовлення</button></div>
    </div>

    <div id="checkoutModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4">Оформлення замовлення</h2>
            <form id="orderForm" class="space-y-3">
                <input type="text" id="name" placeholder="Ваше ім'я" required class="w-full p-2 border rounded">
                <input type="tel" id="phone" placeholder="Ваш телефон" required class="w-full p-2 border rounded">
                <button type="submit" class="w-full bg-brand-900 text-white py-2 rounded">Надіслати замовлення</button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const products = [{id: 1, title: "Сироватка", price: 650}, {id: 2, title: "Емульсія", price: 730}];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('drawer-closed');
            document.getElementById('cart-drawer').classList.toggle('drawer-open');
        }

        function checkout() {
            if(cart.length === 0) return alert('Кошик порожній');
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const BOT_TOKEN = 'ВАШ_ТОКЕН_БОТА';
            const CHAT_ID = 'ВАШ_CHAT_ID';
            const msg = `Замовлення: ${document.getElementById('name').value} - ${cart.map(i => i.title).join(', ')}`;
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: msg})
            });
            alert('Дякуємо!');
            document.getElementById('checkoutModal').classList.add('hidden');
        });
        
        // Ви можете додати рендер товарів тут
    </script>
</body>
</html>
